name: Flutter beta clean build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android_beta_clean_build:
    name: Android beta clean build
    runs-on: ubuntu-26.04
    continue-on-error: true
    timeout-minutes: 45
    env:
      ANDROID_API_LEVEL: 36

    steps:
      - name: Provide more disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc /opt/cabal /opt/stack
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf "/usr/local/share/boost"
          sudo apt-get remove -y 'php.*'
          sudo docker image prune --all --force

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: 'zulu'
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'beta'
          cache: true
          cache-key: beta-android

      - run: flutter --version

      - run: flutter pub get

      - name: Analyze plugin and example app
        continue-on-error: true
        run: flutter analyze 2>&1 | tee analyze.log

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: flutter test

      - name: Summarize analyzer findings and test result
        if: ${{ !cancelled() }}
        env:
          TEST_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: |
          {
            echo "### Flutter beta analyzer findings"
            echo "Flutter: $(flutter --version | head -n 1)"
            echo "Unit tests: ${TEST_OUTCOME}"
            echo '```'
            grep -E '^\s*(info|warning|error) •' analyze.log || echo 'No findings'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create default project and add Adyen checkout plugin package
        run: |
          flutter create --template=app --platforms=android,ios demo_project
          cd demo_project
          # Suppress Kotlin JVM target consistency errors in dependencies
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties

          dart pub add 'adyen_checkout:{"path":"../"}'

      - name: Build Android app
        working-directory: demo_project
        run: flutter build apk --debug 2>&1 | tee build.log

      - name: Summarize Android build warnings
        if: ${{ !cancelled() }}
        working-directory: demo_project
        run: |
          {
            echo "### Android beta build warnings"
            echo '```'
            grep -iE 'warning|deprecat' build.log || echo 'No warnings'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Android beta logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-beta-android-logs
          path: |
            analyze.log
            demo_project/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          cache-read-only: false

      - name: Run Android connected installation test
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          working-directory: ./demo_project
          script: |
            echo "Emulator launched"
            flutter run --debug --no-resident --use-application-binary=build/app/outputs/flutter-apk/app-debug.apk

  ios_beta_clean_build:
    name: iOS beta clean build
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 45
    env:
      IPHONE_MODEL: "iPhone 17"

    steps:
      - name: Provide more disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: 'beta'
          cache: true
          cache-key: beta-ios

      - run: flutter pub get

      - name: Clean SwiftPM Artifacts Cache
        run: rm -rf /Users/runner/Library/Caches/org.swift.swiftpm/artifacts

      - name: Create default project and add Adyen checkout plugin package
        run: |
          flutter create --template=app --platforms=android,ios demo_project
          cd demo_project
          dart pub add 'adyen_checkout:{"path":"../"}'

      - run: flutter --version

      - name: Build iOS app for simulator
        working-directory: demo_project
        run: flutter build ios --debug --simulator 2>&1 | tee build.log

      - name: Summarize iOS build warnings
        if: ${{ !cancelled() }}
        working-directory: demo_project
        run: |
          {
            echo "### iOS beta build warnings"
            echo '```'
            grep -iE 'warning|deprecat' build.log || echo 'No warnings'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS beta logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flutter-beta-ios-logs
          path: demo_project/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Install iOS app on simulator
        working-directory: demo_project
        run: |
          xcrun simctl list devices
          xcrun simctl boot "$IPHONE_MODEL"
          xcrun simctl bootstatus "$IPHONE_MODEL" -b
          xcrun simctl install "$IPHONE_MODEL" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$IPHONE_MODEL" com.example.demoProject
