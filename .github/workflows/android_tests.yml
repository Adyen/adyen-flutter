name: Android unit tests

on:
  workflow_call:
    inputs:
      flutter-version:
        description: 'Flutter version'
        required: false
        default: '3.47.x'
        type: string

permissions:
  contents: read

jobs:
  android_tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: example/android
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'zulu'
          java-version: 17

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: 'stable'
          cache: true

      - run: flutter doctor -v
      - run: flutter clean
      - run: flutter pub get

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          gradle-version: '8.13'

      - name: Init gradle wrapper
        run: gradle wrapper

      - name: Lint check
        run: ./gradlew :adyen_checkout:ktlintCheck :adyen_checkout:lintReportDebug

      - name: Unit tests with code coverage reporting
        run: ./gradlew :adyen_checkout:jacocoTestReport

      - name: Cache android reports
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: save-android-reports
        with:
          path: example/build/adyen_checkout/reports
          key: android-reports