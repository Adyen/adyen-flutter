buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}


group 'com.adyen.adyen_checkout'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Branch-based (SNAPSHOT) integration is active: Android dependencies resolve the
// weekly Sunday snapshot published to Central Portal Snapshots. To switch back to a
// release pin, comment out this block and set the release version below instead.
[rootProject, this].each {
    it.allprojects {
        repositories {
            maven {
                name = 'Central Portal Snapshots'
                url = 'https://central.sonatype.com/repository/maven-snapshots/'
                content {
                    includeGroup("com.adyen.checkout")
                }
            }
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply from: 'ktlint.gradle'
apply from: 'jacoco.gradle'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace = "com.adyen.checkout.flutter"
    compileSdk 37

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        compose true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        test.java.srcDirs += 'src/test/kotlin'
    }

    defaultConfig {
        minSdkVersion 23
        consumerProguardFiles 'proguard-rules.pro'
    }

    dependencies {
        // Weekly Sunday snapshot from adyen-android main. Bump the date to move the pin forward.
        def adyenSnapshotVersion = "2026.10.11-SNAPSHOT"
        implementation "com.adyen.checkout:core:${adyenSnapshotVersion}"
        implementation "com.adyen.checkout:card:${adyenSnapshotVersion}"
        implementation "com.adyen.checkout:blik:${adyenSnapshotVersion}"
        implementation "com.adyen.checkout:googlepay:${adyenSnapshotVersion}"
        implementation "com.adyen.checkout:3ds2:${adyenSnapshotVersion}"
        implementation "com.adyen.checkout:cse:${adyenSnapshotVersion}"
        implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'

        // Compose Dependencies
        implementation 'androidx.compose.ui:ui:1.10.6'
        implementation 'androidx.compose.material3:material3:1.4.0'
        implementation 'androidx.compose.ui:ui-tooling-preview:1.10.6'
        implementation 'androidx.activity:activity-compose:1.13.0'

        // Debug tools for Compose
        debugImplementation 'androidx.compose.ui:ui-tooling:1.10.6'
        debugImplementation 'androidx.compose.ui:ui-test-manifest:1.10.6'

        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.23.0'
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            all {
                useJUnitPlatform()

                testLogging {
                    events "passed", "skipped", "failed", "standardOut", "standardError"
                    outputs.upToDateWhen { false }
                    showStandardStreams = true
                }
            }
        }
    }

    lintOptions {
        disable 'RestrictedApi'
    }
}
