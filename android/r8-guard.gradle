import org.gradle.api.artifacts.result.ResolvedComponentResult
import org.gradle.api.artifacts.result.ResolvedDependencyResult

// Adyen 3DS2 SDK 2.2.28 is miscompiled by R8 versions older than 9.4.18, which breaks 3D Secure 2
// payments in optimized release builds. Fail the R8 task instead of silently shipping a broken app.
//
// Warn only: adyen.failOnAffectedR8=false
// Skip:      adyen.skipR8Check=true
class AdyenR8Guard {
    static final String SKIP_PROPERTY = 'adyen.skipR8Check'
    static final String FAIL_PROPERTY = 'adyen.failOnAffectedR8'
    static final String AFFECTED_THREE_DS2_VERSION = '2.2.28'
    static final List<Integer> MINIMUM_R8_VERSION = [9, 4, 18]

    static String effectiveR8Version(ClassLoader classLoader) {
        try {
            return classLoader.loadClass('com.android.tools.r8.Version').getField('LABEL').get(null)
        } catch (Exception ignored) {
            return null
        }
    }

    static List<Integer> parseVersion(String version) {
        if (version == null) return null
        def match = version =~ /^(\d+)\.(\d+)\.(\d+)/
        return match.find() ? (1..3).collect { match.group(it).toInteger() } : null
    }

    static boolean isAffected(List<Integer> r8Version) {
        for (int i = 0; i < 3; i++) {
            if (r8Version[i] != MINIMUM_R8_VERSION[i]) return r8Version[i] < MINIMUM_R8_VERSION[i]
        }
        return false
    }

    static String findThreeDs2Version(ResolvedComponentResult root) {
        def visited = new HashSet()
        def queue = new ArrayDeque([root])
        while (!queue.isEmpty()) {
            def component = queue.poll()
            if (!visited.add(component.id)) continue
            def module = component.moduleVersion
            if (module?.group == 'com.adyen.threeds' && module?.name == 'adyen-3ds2') {
                return module.version
            }
            component.dependencies.each {
                if (it instanceof ResolvedDependencyResult) queue.add(it.selected)
            }
        }
        return ''
    }

    static String affectedMessage(String r8Version, String variantName, boolean failing) {
        def message = """\
            Adyen Checkout: R8 ${r8Version} is not compatible with Adyen 3DS2 SDK ${AFFECTED_THREE_DS2_VERSION} and breaks
            3D Secure 2 payments in optimized builds of the '${variantName}' variant.

            Fix one of:
              1. Upgrade to Android Gradle Plugin 9.4.1 or later.
              2. With AGP 8, pin R8 ${MINIMUM_R8_VERSION.join('.')} or later in settings.gradle.
            See https://github.com/Adyen/adyen-flutter#android

            If you have verified 3DS2 payments with your setup (for example with -dontoptimize),
            add ${SKIP_PROPERTY}=true to gradle.properties.""".stripIndent()
        if (!failing) return message
        return message + """
            To log this as a warning instead of failing the build, add ${FAIL_PROPERTY}=false
            to gradle.properties.""".stripIndent()
    }

    static String unknownR8Message(String r8Version, String variantName) {
        """\
            Adyen Checkout: Could not determine the R8 version (${r8Version ?: 'unknown'}) of the '${variantName}' variant,
            so the check for R8 versions that break Adyen 3DS2 SDK ${AFFECTED_THREE_DS2_VERSION} was skipped.
            Make sure the build uses R8 ${MINIMUM_R8_VERSION.join('.')} or later.
            See https://github.com/Adyen/adyen-flutter#android""".stripIndent()
    }
}

rootProject.allprojects { appProject ->
    appProject.plugins.withId('com.android.application') { appPlugin ->
        def skip = appProject.providers.gradleProperty(AdyenR8Guard.SKIP_PROPERTY)
            .map { it.toBoolean() }
            .getOrElse(false)
        if (skip) return
        def failOnAffected = appProject.providers.gradleProperty(AdyenR8Guard.FAIL_PROPERTY)
            .map { it != 'false' }
            .getOrElse(true)
        def r8Version = AdyenR8Guard.effectiveR8Version(appPlugin.class.classLoader)
        def parsedR8Version = AdyenR8Guard.parseVersion(r8Version)
        if (parsedR8Version != null && !AdyenR8Guard.isAffected(parsedR8Version)) return

        appProject.tasks.matching { it.name ==~ /minify.+WithR8/ }.configureEach { r8Task ->
            def variantName = r8Task.name
                .replaceFirst(/^minify/, '')
                .replaceFirst(/WithR8$/, '')
                .uncapitalize()
            def configurationName = "${variantName}RuntimeClasspath"
            if (!appProject.configurations.names.contains(configurationName)) return
            def threeDs2Version = appProject.configurations.named(configurationName)
                .flatMap { it.incoming.resolutionResult.rootComponent }
                .map { AdyenR8Guard.findThreeDs2Version(it) }
            def fail = parsedR8Version != null && failOnAffected
            def message = parsedR8Version == null
                ? AdyenR8Guard.unknownR8Message(r8Version, variantName)
                : AdyenR8Guard.affectedMessage(r8Version, variantName, fail)
            r8Task.inputs.property(AdyenR8Guard.FAIL_PROPERTY, fail)
            r8Task.doFirst { task ->
                if (threeDs2Version.get() != AdyenR8Guard.AFFECTED_THREE_DS2_VERSION) return
                if (fail) throw new GradleException(message)
                task.logger.warn(message)
            }
        }
    }
}
